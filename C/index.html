<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My smart to do Lists</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
       <header>
        <h1>My smart to do Lists</h1>
        <p>Manage your daily tasks efficiently.</p>
       </header>
      <a href="https://github.com/" target="_blank" rel="noopener noreferrer">
    Visit GitHub
</a>

       alt="Visit Github" 
       width="100" height="100">
       <main>
        <section>
            <h2>Add task</h2>
            <form id="taskForm">
                <label for="taskName">Task name:</label>
                <input type="text" id="taskName" name="taskName" required>
                <label for="dueDate">Due date:</label>
                <input type="date" id="dueDate" name="dueDate" required>
                <label for="priority">Priority:</label>
                <select id="priority" name="priority" required>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <button type="submit">Add Task</button>
            </form>
        </section>
       <section class="task-list-section">

    <h3>Task List</h3>

    <!-- Search and Filter Toolbar -->
    <div class="task-toolbar">

        <div class="search-box">
            <label for="searchTask">Search Tasks</label>

            <input
                type="text"
                id="searchTask"
                placeholder="Search tasks..."
            >
        </div>

        <div class="filter-box">
            <label for="filterPriority">Priority</label>

            <select id="filterPriority">
                <option value="all">All Priorities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
        </div>

    </div>

    <!-- Task Table -->
    <table>

        <thead>
            <tr>
                <th>Task Name</th>
                <th>Due Date</th>
                <th>Priority</th>
                <th>Completed</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="taskList">
        </tbody>

    </table>

</section>
        <section class="task-counter">
    <h2>Task Overview</h2>

    <div class="counter-grid">

        <div class="counter-card total-card">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
            <span>All your tasks</span>
        </div>

        <div class="counter-card completed-card">
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
            <span>Tasks finished</span>
        </div>

        <div class="counter-card pending-card">
            <h3>Pending</h3>
            <p id="pendingTasks">0</p>
            <span>Tasks remaining</span>
        </div>

    </div>
</section>
       </main>
        <footer>
            <p>My Smart to do app</p>
        </footer> 
        <script src="script.js"></script>
    </body>
</html>
