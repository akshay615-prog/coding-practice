<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My smart to do Lists</title>
    </head>
    <body>
       <header>
        <h1>My smart to do Lists</h1>
        <p>Manage your daily tasks efficiently.</p>th>
       </header>

       alt="Visit Github" 
       width="100" height="100">
       <main>
        <section>
            <h2>Add task</h2>
            <form id="taskForm">
                <label for="taskName">Task name:</label>
                <input type="text" id="taskName" name="taskName" required>
                <label for="dueDate">Due date:</label>
                <input type="date" id="dueDate" name="dueDate" required>
                <label for="priority">Priority:</label>
                <select id="priority" name="priority" required>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <button type="submit">Add Task</button>
            </form>
        </section>
        <section>
            <h3>Task List</h3>
<table border="1">
    <thead>
        <tr>
            <th>Task Name</th>
            <th>Due Date</th>
            <th>Priority</th>
            <th>Completed</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="taskList">
    </tbody>
</table>
        </section>
        <section>
            <h4>Task Counter</h4>
            <p>Total tasks: <span id="totalTasks">0</span></p>
            <p>Completed tasks: <span id="completedTasks">0</span></p>
            <p>Pending tasks: <span id="pendingTasks">0</span></p>
        </section>
        <section>
            <h5>Search Tasks</h5>
            <input type="text" 
            id="searchTask" 
            placeholder="Search tasks...">
            <h5>Filter Tasks</h5>
            <select id="filterPriority">
                <option value="all">All</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
        </section>
       </main>
        <footer>
            <p>My Smart to do app</p>
        </footer> 
        <script src="script.js"></script>
    </body>
</html>
